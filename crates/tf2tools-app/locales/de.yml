# Deutsch (de, preview). Values only; keys, %{name} and line layout follow en.yml.
# Glossary, the reference for every surface:
#   Voice: standard German with "ß"; informal "du", lower case ("dein"), short du imperative (versuch, stell,
#     schließ); buttons and menus take the infinitive ("Installieren"). Sentence case, nouns capitalised; only 1
#     takes "one" ("0 HUDs"); shorter correct wording wins; hyphenated compounds ("HUD-Maker", "TF2-Ordner").
#   Kept as is: HUD(s), Sound(s) (never "Geräusch"/"Klang"), Hitsound(s), Killsound(s), Add-on(s), Mod(s),
#     Log(s), mastercomfig, logs.tf, GameBanana, hud-db, Steam, TF2Tools, Cache; class names stay English.
#   library = "Bibliothek"; store = "Shop" (Addon Store = "Add-on-Shop"); curated = "kuratiert";
#     settings = "Einstellungen"; cosmetics = "Kosmetika"; OK = "OK"; item = "Gegenstand" for TF2 game
#     items only, an entry of a store, cache or library (HUD, sound, add-on) = "Eintrag"/"Einträge".
#   crosshair = "Fadenkreuz"; install = "installieren"; uninstall = "deinstallieren";
#     download = "herunterladen", a download = "Download"; update = "aktualisieren", an update = "Update".
#   sync = "synchronisieren", a sync = "Synchronisierung"; Resync = "Synchronisieren"; Refresh = "Neu laden";
#     reset = "zurücksetzen"; save = "speichern"; search = "suchen"; browse = "Durchsuchen".
#   folder = "Ordner"; file = "Datei"; path = "Pfad"; delete = "löschen"; remove = "entfernen";
#     enable/disable = "aktivieren"/"deaktivieren"; preset = "Voreinstellung"; preview = "Vorschau".
#   profile = "Profil"; match = "Match"; player = "Spieler"; nickname = "Spitzname"; map = "Karte";
#     HUD Maker = "HUD-Maker"; Crosshair Maker = "Fadenkreuz-Maker"; Activity Log = "Aktivitätsprotokoll".
#   States: running "Wird <Partizip>..." ("Wird heruntergeladen..."); done as a participle ("HUD installiert");
#     failures "<Subjekt> konnte nicht <Partizip> werden." or "<Nomen> fehlgeschlagen".
#   Game terms as the TF2 client (tf_german.txt, "du" not "Sie"; "King of the Hill" kept): "Primärwaffe", "Sekundärwaffe", "Nahkampfwaffe";
#     ÜberCharge = "Überladung"; "Sentrygun", "Dispenser", "Teleporter", "Haftbombenwerfer", "Krit-a-Cola"
#   Formats: decimal ",", grouping "." ("4.812"); dates "05.03.2026", "5. März 2026" (months "Jan.",
#     "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sept.", "Okt.", "Nov.", "Dez."); counts
#     "1,3 Tsd." / "1,2 Mio."; "Std.", "Min.", "Sek."; number and unit joined by \u00A0 where es.yml has one.
