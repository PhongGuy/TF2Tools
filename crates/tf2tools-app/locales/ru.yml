    unmeasured: "Не удалось измерить размер кэша логов."
    size_tb: "%{size} ТБ"
    size_gb: "%{size} ГБ"
    size_mb: "%{size} МБ"
    size_kb: "%{size} КБ"
    size_b: "%{size} Б"
