    unknown: "Неизвестно"
    resync: "Синхронизировать"
    syncing: "Синхронизация..."
    sounds: { title: "Магазин звуков", description: "Хитсаунды и килсаунды с GameBanana" }
    crosshairs: { title: "Магазин прицелов", description: "Моды прицелов с GameBanana" }
    gamebanana_huds: { title: "Магазин HUD с GameBanana", description: "Моды HUD с GameBanana" }
    curated_huds: { title: "Подборка HUD", description: "HUD, отобранные mastercomfig" }
