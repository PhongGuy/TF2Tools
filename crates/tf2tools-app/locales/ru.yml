    hide: "Скрыть лицензии"
  help:
    title: "Помощь и обратная связь"
    description: "Что-то не получается или сломалось? Загляните в справку или расскажите нам."
    report: "Сообщить о проблеме"
    open: "Справка"
  toast:
    saved: "Настройки сохранены"
    found: "TF2 найдена"
    not_found: "TF2 не найдена"
    manual: "Укажите папку TF2 вручную"
    installs: { one: "Найдена %{count} установка; выберите нужную ниже", few: "Найдено %{count} установки; выберите нужную ниже", many: "Найдено %{count} установок; выберите нужную ниже" }

updater:
