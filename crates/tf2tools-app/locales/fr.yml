# Français (fr, preview). Values only; keys, %{name} and line layout follow en.yml.
# Glossary, the reference for every surface:
#   Voice: "vous" throughout; buttons and menu items take the infinitive ("Installer", "Réessayer");
#     sentence case (only the first word and proper names capitalised); shorter correct wording wins.
#   Kept as is: HUD (masculine, plural "HUD"), hitsound(s), killsound(s), add-on(s), mod(s), log(s),
#     mastercomfig, logs.tf, GameBanana, hud-db, Steam, TF2Tools, HUD Maker, Crosshair Maker, OK, cache.
#   crosshair = "viseur"; settings = "Paramètres"; library = "Bibliothèque"; store = "Magasin";
#     item = "objet"; cosmetics = "Cosmétiques"; curated = "sélectionné"; the Logs page = "Journaux",
#     Activity Log = "Journal d'activité"; a logs.tf match log = "log" (masculine, plural "logs").
#   install = "installer"; uninstall = "désinstaller"; download = "télécharger", a download = "téléchargement";
#     update = "mettre à jour", an update = "mise à jour"; sync = "synchroniser", a sync = "synchronisation";
#     Resync = "Resynchroniser"; Refresh = "Actualiser"; reset = "réinitialiser"; save = "enregistrer".
#   search = "rechercher"; browse = "Parcourir"; folder = "dossier"; file = "fichier"; path = "chemin";
#     delete = "supprimer"; remove = "retirer"; enable/disable = "activer"/"désactiver"; preset = "préréglage";
#     preview = "aperçu"; profile = "profil"; match = "match"; player = "joueur"; nickname = "pseudo";
#     map = "carte"; copy = "copie".
#   Game terms as the TF2 client (tf_french.txt); class names stay English; "Arme principale", "Arme secondaire",
#     "Arme corps à corps" (short labels "Secondaire", "Corps à corps"); "ÜberCharge"; "Mitrailleuse",
#     "Distributeur", "Téléporteur"; health = "Santé"; King of the Hill = "roi de la colline"; Mad Milk =
#     "Lait frelaté"; power-ups as TF_Powerup_* (Haste = "Rapidité").
#   States: running "<Nom>..." ("Téléchargement..."); done as a past participle ("HUD installé"); failures
#     "Impossible de <infinitif> <objet>." or "Échec du/de la <nom>".
#   Elision: put %{name} after a colon or a neutral noun ("Supprimer le HUD %{name}"), never after de/le/la.
#   Plurals: "one" covers 0 and 1, so it must read right at zero ("0 fichier", never "un fichier").
#   Typography: \u00A0 before : ; ! ? and a literal %, inside «\u00A0 \u00A0»; group separator \u202F.
#     Always these escapes in double quotes with upper-case hex, never the raw character.
#   Formats: decimal ","; dates "05/03/2026", "5 mars 2026"; "1,3 k", "1,2 M"; o, Ko, Mo, Go, To; h, min, s.
