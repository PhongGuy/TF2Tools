# 简体中文 (zh-CN, preview). Values only; keys, %{name} and line layout follow en.yml.
# Glossary, the reference for every surface:
#   Voice: plain modern UI Chinese as Steam and the TF2 client write it; no "您"/"你" where a sentence
#     can address no one, "您" where it must. Buttons are short verbs ("安装", "下载", "重试").
#   Kept in Latin: HUD, TF2, TF2Tools, mastercomfig, logs.tf, GameBanana, hud-db, Steam, UberCharge,
#     HUD Maker, Crosshair Maker, VDF and command names.
#   settings = "设置"; library = "库"; store = "商店"; item = "物品"; preset = "预设"; profile = "配置文件";
#     Activity Log = "活动日志"; crosshair = "准星"; hitsound = "命中音效"; killsound = "击杀音效";
#     add-on = "插件".
#   install = "安装"; uninstall = "卸载"; download = "下载"; update = "更新"; sync = "同步";
#     Refresh = "刷新"; reset = "重置"; save = "保存"; search = "搜索"; browse = "浏览"; apply = "应用".
#   folder = "文件夹"; file = "文件"; path = "路径"; delete = "删除"; remove = "移除";
#     enable/disable = "启用"/"禁用"; preview = "预览"; match = "比赛"; player = "玩家"; map = "地图";
#     copy = "副本" (noun) / "复制" (verb); health = "生命值"; ammo = "弹药".
#   Game terms as the TF2 client (tf_schinese.txt): 侦察兵, 士兵, 火焰兵, 爆破手, 机枪手, 工程师, 医生,
#     狙击手, 间谍; 主武器, 副武器, 近战武器; 步哨枪, 补给器, 传送装置; King of the Hill = "山丘之王";
#     Mad Milk = "疯狂的牛奶"; Bonk! = "原子能饮料"; Crit-a-Cola = "爆击可乐"; killstreak = "连杀";
#     power-ups as TF_Powerup_* (Haste = "急速").
#   Punctuation: full-width ，。：；！？（） and “” inside Chinese sentences; ellipsis "…", never "...".
#   Spacing: no space between Han characters; one ASCII space between Han and Latin, digits or a
#     %{variable} ("%{count} 个 HUD", "安装 %{name}"), except inside format and duration values.
#   Plurals: Chinese has one form, so every plural map holds only "other".
#   Formats: decimal "."; group ","; dates "2026-03-05", "2026年3月5日"; "1.3万", "1.2亿" (step 10000);
#     B, KB, MB, GB, TB; 小时, 分钟, 秒.
