# Español (es, preview). Values only; keys, %{name} and line layout follow en.yml.
# Glossary, the reference for every surface:
#   Voice: neutral Spanish, informal "tú", never "vosotros"; no regional words ("equipo", not
#     "ordenador"/"computadora"). Buttons and menu items in the imperative ("Instalar", "Reintentar").
#   Case: sentence case for titles and buttons ("Tienda de sonidos"); always the opening "¿" and "¡".
#   Kept as is: HUD(s), hitsound(s), killsound(s), add-on(s) (masculine), mod(s), log(s), mastercomfig,
#     logs.tf, GameBanana, hud-db, Steam, TF2Tools; class names stay English as the TF2 client shows.
#   library = "biblioteca"; store = "tienda" (Addon Store = "Tienda de add-ons"); curated = "seleccionados".
#   install = "instalar"; uninstall = "desinstalar"; download = "descargar" ("Descargando...").
#   update = "actualizar", an update = "actualización"; sync = "sincronizar", a sync = "sincronización";
#     Resync = "Sincronizar"; Refresh = "Recargar"; reset = "restablecer"; save = "guardar".
#   settings = "ajustes"; folder = "carpeta"; file = "archivo"; path = "ruta"; browse = "Examinar".
#   delete = "eliminar"; remove = "quitar"; enable/disable = "activar"/"desactivar"; search = "buscar".
#   preset = "preajuste"; preview = "vista previa"; profile = "perfil"; match = "partida";
#     player = "jugador"; nickname = "apodo"; cache = "caché" (feminine).
#   UI choices of TF2Tools, outside the client tie-break (never "fixed" from tf_spanish.txt):
#     item = "objeto" in every sense; cosmetic = "cosmético"; OK = "Aceptar"; crosshair = "mira".
#   Crosshair Maker = "Creador de miras"; HUD Maker = "Creador de HUD"; match log = "log de partida";
#     Activity Log = "Registro de actividad"; elsewhere "log" stays.
#   Game terms as the TF2 client (tf_spanish.txt; where the Latin American client differs, names of
#     game things follow tf_spanish.txt: "bomba lapa", "teleportador", "Rey de la Colina").
#     Slots: "Arma principal", "Arma secundaria", "Arma cuerpo a cuerpo"; ÜberCharge = "Supercarga".
#   Past events in the simple past ("Se instaló"), never "se ha instalado"; failures "No se pudo <verbo>...".
#   Plurals: only 1 takes "one"; 0 takes "other" ("0 HUDs", "hace 0 días"). Prefer the shorter wording.
#   Formats: decimal ",", grouping "." always ("4.812"); dates "05/03/2026" and "5 mar 2026" (months
#     lower case, no dot, "sept"); counts "1,3 mil" / "1,2 M"; number and unit joined by \u00A0.
