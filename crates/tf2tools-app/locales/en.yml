    title: "Audio"
    description: "Preview volume for hitsounds and killsounds"
    volume: "Volume: %{percent}%"
  cache:
    title: "Store Cache"
    description: "How often to re-sync store data"
    duration: "Cache duration: %{duration}"
    hint: "Stores will re-sync automatically when cache expires. Default: 7 days (168 hours)."
    hours: { one: "%{count} hour", other: "%{count} hours" }
    days: { one: "%{count} day", other: "%{count} days" }
    days_hours: "%{days}d %{hours}h"
