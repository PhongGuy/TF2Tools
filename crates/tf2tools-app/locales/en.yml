# English: the source text and the fallback for every other language.
# To translate, copy this file to <code>.yml; see CONTRIBUTING.md, Translations.
settings:
  language:
    title: "Language"
    description: "The language TF2Tools shows its text in"
    note: "Parts of TF2Tools not yet translated stay in English."
  app_updates:
    title: "App Updates"
    version: "Current version: v%{version}"
  tf2:
    title: "TF2 Installation"
    description: "Path to your Team Fortress 2 installation folder"
    placeholder: "/path/to/Team Fortress 2"
    browse: "Browse"
    detect: "Auto-detect"
  audio:
    title: "Audio"
    description: "Preview volume for hitsounds and killsounds"
    volume: "Volume: %{percent}%"
  cache:
    title: "Store Cache"
    description: "How often to re-sync store data"
    duration: "Cache duration: %{duration}"
    hint: "Stores will re-sync automatically when cache expires. Default: 7 days (168 hours)."
    hours: { one: "%{count} hour", other: "%{count} hours" }
    days: { one: "%{count} day", other: "%{count} days" }
    days_hours: "%{days}d %{hours}h"
  addons:
    title: "Add-ons"
    description: "GameBanana skins, effects, GUIs, textures and game files"
    mature: "Show mature add-ons"
  library:
    title: "Library"
    description: "Where TF2Tools keeps your HUDs, sounds, crosshairs and add-ons"
    usage: "Your library uses %{disk} on disk (%{unpacked} unpacked)."
    unmeasured: "The library size could not be measured."
  logs_tf:
    title: "logs.tf"
    description: "How opened match logs name players, and how long full logs are kept"
    nicknames: "Show nicknames in match logs"
    keep:
      label: "Keep full logs for"
      days: { one: "%{count} day", other: "%{count} days" }
      forever: "Forever"
      frees: "%{option}, frees about %{size}"
    cost: "Each full log takes about 10 KB. The space grows with how many logs your tracked players have, so Forever can grow large."
    usage: "The logs cache uses about %{cache}; %{logs} about %{full}."
    full_logs: { one: "%{count} full log uses", other: "%{count} full logs use" }
    measuring: "Measuring..."
    unmeasured: "The logs cache size could not be measured."
    size_tb: "%{size} TB"
    size_gb: "%{size} GB"
    size_mb: "%{size} MB"
    size_kb: "%{size} KB"
    size_b: "%{size} B"
  sync:
    items: { one: "%{count} item cached", other: "%{count} items cached" }
    last_synced: "Last synced: %{when}"
    failed: "Sync failed: %{error}"
    never: "Never"
    unknown: "Unknown"
    resync: "Resync"
    syncing: "Syncing..."
    sounds: { title: "Sound Store", description: "GameBanana hitsounds and killsounds" }
    crosshairs: { title: "Crosshair Store", description: "GameBanana crosshair mods" }
    gamebanana_huds: { title: "GameBanana HUD Store", description: "GameBanana HUD mods" }
    curated_huds: { title: "Curated HUD Store", description: "Curated HUDs from mastercomfig" }
    addons: { title: "Addon Store", description: "Mastercomfig performance and QoL addons" }
  save: "Save Settings"
  licences:
    title: "Licences"
    description: "TF2Tools uses work and content made by others. These are their licences and credits."
    show: "Show notices"
    hide: "Hide notices"
  help:
    title: "Help and feedback"
    description: "Stuck, or found something broken? Read the help or tell us about it."
    report: "Report a problem"
    open: "Help"
  toast:
    saved: "Settings saved"
    found: "TF2 found"
    not_found: "TF2 not found"
    manual: "Select your TF2 folder manually"
    installs: { one: "%{count} install found; choose one below", other: "%{count} installs found; choose one below" }
  activity:
    updated: "Settings updated"

updater:
  status:
    up_to_date: "Up to date"
    checking: "Checking for updates..."
    available: "v%{version} available"
    available_page: "v%{version} available. Download it from the release page."
    downloading: "Downloading... %{percent}%"
    ready: "Update ready — restart to apply"
    installing: "Installing update..."
    unavailable: "Automatic updates aren't available in this version. Get new versions from the release page."
    reopen: "TF2Tools has been updated. Close and reopen it to finish."
  button:
    check: "Check for Updates"
    install: "Download & Install"
    release_page: "Open release page"
    restart: "Restart Now"
  banner:
    update: "Update"
    available: "Update v%{version} available"
    downloading: "Downloading..."
    restart: "Restart"
    close: "Close"
  failure:
    title: "Update failed"
    offline: "Couldn't reach the update server. Check your internet connection and try again."
    unreadable: "The update information couldn't be read. Try again later."
    unverified: "Update check failed: the update could not be verified. Try again later."
    stopped: "The download stopped. Check your internet connection and try again."
    unserved: "The update couldn't be downloaded right now. Try again later, or get it from the release page."
    busy: "The update server is busy right now. Try again in a few minutes."
    damaged: "The download was damaged. Try again."
    disk: "Couldn't save the update. Make sure your disk has free space, then try again."
    use_page: "TF2Tools can't update itself where it's installed. Download the new version from the release page instead."
    install_io: "Couldn't install the update. Try again, or download the new version from the release page."
    installer: "Couldn't start the installer. Try again, or download the new version from the release page."
    changed: "The update changed before it could be installed. Try again."
    unknown: "Something went wrong with the update. Try again later."
    check_slow: "Checking for updates took too long. Check your internet connection and try again."
    download_slow: "The download took too long. Check your internet connection and try again."
    check_first: "Check for updates first."
    download_first: "Download the update first."

common:
  list:
    separator: ", "
    last: "%{rest} and %{last}"
  number:
    decimal: "."
    group: ","
  count:
    thousand: "%{number}K"
    million: "%{number}M"
  size:
    b: "%{size} B"
    kb: "%{size} KB"
    mb: "%{size} MB"
    gb: "%{size} GB"
    tb: "%{size} TB"
  duration:
    played_minutes: "%{minutes}m"
    played_hours_minutes: "%{hours}h %{minutes}m"
    minutes: "%{minutes} min"
    hours: "%{hours} h"
    hours_minutes: "%{hours} h %{minutes} min"
    seconds: "%{seconds} s"
  date:
    numeric: "%{year}-%{month}-%{day}"
    date_time: "%{date} %{time}"
    day_month_year: "%{day} %{month} %{year}"
    month_day_year: "%{month} %{day}, %{year}"
    month: { jan: "Jan", feb: "Feb", mar: "Mar", apr: "Apr", may: "May", jun: "Jun", jul: "Jul", aug: "Aug", sep: "Sep", oct: "Oct", nov: "Nov", dec: "Dec" }

hud_store:
  added: "Added %{date}"

