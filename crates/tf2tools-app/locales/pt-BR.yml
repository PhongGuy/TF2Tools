# Português do Brasil (pt-BR, preview). Values only; keys, %{name} and line layout follow en.yml.
# Glossary, the reference for every surface:
#   Voice: informal "você"; buttons and menu items in the imperative ("Instalar", "Salvar").
#   Case: sentence case for titles and buttons ("Loja de sons", not "Loja de Sons").
#   Kept as is: HUD(s), hitsound(s), killsound(s), mod(s), cache, log(s), mastercomfig, logs.tf,
#     GameBanana, hud-db, Steam, TF2Tools; class names stay English as the TF2 client shows them.
#   add-on = "add-on" (plural "add-ons", hyphenated, masculine); Addon Store = "Loja de add-ons".
#   crosshair = "mira"; Crosshair Maker = "Criador de miras"; HUD Maker = "Criador de HUD".
#   library = "biblioteca"; store = "loja"; curated = "selecionados".
#   install = "instalar", installed = "instalado"; uninstall = "desinstalar".
#   download = "baixar" ("Baixando..."); update = "atualizar", an update = "atualização".
#   sync = "sincronizar", a sync = "sincronização"; Resync = "Sincronizar"; Refresh = "Recarregar".
#   settings = "configurações"; folder = "pasta"; path = "caminho"; browse = "Procurar".
#   preset = "predefinição"; preview = "prévia"; profile = "perfil"; match = "partida".
#   remove = "remover"; delete = "excluir"; enable/disable = "ativar"/"desativar"; search = "buscar".
#   Slots as the TF2 client: "Primária", "Secundária", "Corpo a corpo".
#   Failure lines: "Não foi possível <verbo>..." ("Não foi possível remover o TF2Tools antigo").
#   Activity Log = "Registro de atividades"; match log = "log de partida"; player = "jogador";
#     nickname = "apelido". "log" stays English everywhere except "Registro de atividades".
#   Plurals: only 1 takes "one"; 0 takes "other" ("0 HUDs", "há 0 dias").
#   Formats: decimal ",", grouping ".", dates "05/03/2026" and "5 de mar. de 2026",
#     counts "1,3 mil" / "1,2 mi"; a number and its unit are joined by a no-break space (\u00A0).
