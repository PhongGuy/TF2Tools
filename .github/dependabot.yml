version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/tools/tf2tools-pilot"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: "gpui*"
  # The workflows pin actions to commit hashes; this keeps those pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
