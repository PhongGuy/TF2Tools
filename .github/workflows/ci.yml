# The merge gate: Linux runs `make check`, so a local run matches; Windows lints and tests the same
# workspace with the MSVC toolchain, leaving formatting to Linux.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info and incremental state would overflow the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    runs-on: ubuntu-24.04
    # About 10 minutes with a warm cache; a cold one after a dependency bump runs past 20.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The key ignores build profiles; bump it when Cargo.toml changes how deps compile.
          prefix-key: v1-rust
      # GPUI's windowing, font and GPU libraries, plus ALSA for the sound player.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1 libasound2-dev
      - name: Gate
        run: make check
      - name: Release build check
        # Lint and test unify dev-dependency features into the app; release.yml builds without them.
        run: cargo check --locked -p tf2tools-app --bin tf2tools

  windows:
    runs-on: windows-2025
    # About 20 minutes with a warm cache; the margin covers a cold one.
    timeout-minutes: 40
    defaults:
      run:
        # Git for Windows' bash, so the commands read the same as on Linux.
        shell: bash
    env:
      # aws-lc-sys assembles with NASM, which the image lacks; use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The key ignores build profiles; bump it when Cargo.toml changes how deps compile.
          prefix-key: v1-rust
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -Dwarnings
      - name: Test
        # Run every test binary, so one run lists every Windows failure.
        run: cargo test --locked --workspace --no-fail-fast

  # Audits the workflows themselves. Offline, so a moving upstream ref never fails a PR.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # One pinned tool run per job; nothing worth restoring.
          enable-cache: false
      - name: zizmor
        run: uvx zizmor@1.32.0 --offline .github/workflows
