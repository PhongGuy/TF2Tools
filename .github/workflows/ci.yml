# The merge gate: Linux runs `make check`, so a local run matches; Windows lints and tests the same
# workspace with the MSVC toolchain, leaving formatting to Linux.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info and incremental state would overflow the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    runs-on: ubuntu-24.04
    # A cold build plus the full suite runs about an hour on a hosted runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # GPUI's windowing, font and GPU libraries, plus ALSA for the sound player.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 libegl1 libasound2-dev
      - name: Gate
        run: make check

  windows:
    runs-on: windows-2025
    # Lint plus every test binary runs past an hour on a hosted runner.
    timeout-minutes: 120
    defaults:
      run:
        # Git for Windows' bash, so the commands read the same as on Linux.
        shell: bash
    env:
      # aws-lc-sys assembles with NASM, which the image lacks; use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -Dwarnings
      - name: Test
        # Run every test binary, so one run lists every Windows failure.
        run: cargo test --locked --workspace --no-fail-fast
