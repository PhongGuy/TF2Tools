# Groups merged PRs into release-note sections by label; shared by the Rust app repos.
# Install as .github/release.yml. Every PR carries its issue's label; unlabeled PRs land in Other.
changelog:
  exclude:
    labels: [chore, ci, dependencies, skip-changelog]
    authors: [dependabot, "dependabot[bot]"]
  categories:
    - title: New features
      labels: [feature]
    - title: Fixes
      labels: [bug]
    - title: Usability and accessibility
      labels: [ux, accessibility]
    - title: Performance
      labels: [perf]
    - title: Other changes
      labels: ["*"]
